name: Publish Stable to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish. Leave empty to use the latest published release.'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: resolve_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag." >&2
            exit 1
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Checkout Repository at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Configure GitHub Packages Auth
        run: |
          rm -f ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Install dependencies
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm install --prod
          pnpm add -D tsup typescript

      - name: Derive version from tag
        run: |
          VERSION="${TAG#v}"
          echo "NEW_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Update package.json with release version
        run: |
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Build package
        run: pnpm build

      - name: Prepare GitHub Package name
        run: |
          jq '.name = "@${{ github.repository_owner }}/kenjitsu-extensions"' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Publish to GitHub Packages (latest)
        run: |
          pnpm config set @${{ github.repository_owner }}:registry=https://npm.pkg.github.com
          pnpm publish \
            --registry=https://npm.pkg.github.com \
            --no-git-checks \
            --access restricted \
            --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}